name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI checks
    # shortcut: MongoDB rejects Linux >=6.19; revisit when supported or before runner retirement.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TZ: UTC
      PORT: 3333
      HOST: 127.0.0.1
      LOG_LEVEL: silent
      APP_KEY: ci-only-disposable-app-key-32-chars
      APP_URL: http://127.0.0.1:3333
      JWT_SECRET: ci-only-disposable-jwt-secret-at-least-32-chars
      MONGO_URL: mongodb://127.0.0.1:27017/fishtank_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Application tests
        run: bash scripts/ci-test.sh
      - name: Check status claims
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/check-status-claims.sh
      - name: Script tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test 'scripts/**/*.test.mjs'
